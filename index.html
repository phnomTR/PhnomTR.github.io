<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yusuf ist ein Ei</title>
  <style>
    /* ─── Design ─── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(145deg, #0b1120 0%, #1a2639 100%);
      color: white;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 40px;
      padding: 50px 40px 40px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      transition: transform 0.25s ease;
    }

    .card:hover {
      transform: scale(1.01);
    }

    /* ─── Hauptüberschrift ─── */
    h1 {
      font-size: 3.2rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #fde68a, #f59e0b);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 30px rgba(245, 158, 11, 0.2);
    }

    .sub {
      font-size: 1rem;
      color: #8395a7;
      margin-bottom: 32px;
      font-weight: 300;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 18px;
    }

    #countdown {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .time-box {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 20px;
      padding: 16px 6px;
      min-width: 80px;
      flex: 1 0 auto;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .time-box span {
      display: block;
    }

    .number {
      font-size: 3.2rem;
      font-weight: 700;
      letter-spacing: 2px;
      line-height: 1.2;
      background: linear-gradient(135deg, #f1f5f9, #94a3b8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #64748b;
      margin-top: 4px;
    }

    .finished {
      font-size: 2.2rem;
      font-weight: 600;
      color: #a5f3fc;
      padding: 20px 10px;
      letter-spacing: 1px;
    }

    .footer-note {
      margin-top: 30px;
      font-size: 0.8rem;
      color: #475569;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 20px;
    }
  </style>
</head>
<body>

<div class="card">
  <!-- 🔥 Neuer Text – genau wie gewünscht -->
  <h1>🥚 Yusuf ist ein Ei</h1>
  <div class="sub">⏳ Countdown bis zum 1. Januar 2027</div>

  <div id="countdown">
    <div class="time-box">
      <span class="number" id="days">00</span>
      <span class="label">Tage</span>
    </div>
    <div class="time-box">
      <span class="number" id="hours">00</span>
      <span class="label">Stunden</span>
    </div>
    <div class="time-box">
      <span class="number" id="minutes">00</span>
      <span class="label">Minuten</span>
    </div>
    <div class="time-box">
      <span class="number" id="seconds">00</span>
      <span class="label">Sekunden</span>
    </div>
  </div>

  <div class="footer-note">⚡ Live-Update jede Sekunde</div>
</div>

<script>
  (function() {
    // ─── Ziel-Datum ändern ────────────────────────
    const targetDate = new Date("Jan 1, 2027 00:00:00").getTime();
    // ───────────────────────────────────────────────

    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');
    const container = document.getElementById('countdown');

    function padZero(num) {
      return String(num).padStart(2, '0');
    }

    function updateCountdown() {
      const now = Date.now();
      let diff = targetDate - now;

      if (diff <= 0) {
        container.innerHTML = `<div class="finished">🎉 Countdown abgelaufen!</div>`;
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      diff -= days * (1000 * 60 * 60 * 24);

      const hours = Math.floor(diff / (1000 * 60 * 60));
      diff -= hours * (1000 * 60 * 60);

      const minutes = Math.floor(diff / (1000 * 60));
      diff -= minutes * (1000 * 60);

      const seconds = Math.floor(diff / 1000);

      daysEl.textContent = padZero(days);
      hoursEl.textContent = padZero(hours);
      minutesEl.textContent = padZero(minutes);
      secondsEl.textContent = padZero(seconds);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  })();
</script>

</body>
</html>
