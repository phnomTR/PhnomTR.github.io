<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>phnomTR</title>
  <style>
    /* ─── Minimalist design ─── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #0b1120;
      color: #f1f5f9;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 32px;
      padding: 48px 40px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #facc15, #f59e0b);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 12px;
    }

    .sub {
      font-size: 1.1rem;
      color: #94a3b8;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 20px;
      margin-top: 8px;
    }

    .sub p {
      margin-bottom: 8px;
    }

    .footer {
      margin-top: 28px;
      font-size: 0.8rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>phnomTR</h1>

    <div class="sub">
      <p>Welcome to my page.</p>
      <p>More coming soon.</p>
      <!-- Change or add any text you like -->
    </div>

    <div class="footer">
      ✦ 2026 ✦
    </div>
  </div>
</body>
</html>
